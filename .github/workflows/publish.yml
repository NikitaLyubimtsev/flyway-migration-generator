name: Build ▶ Publish ▶ Release ▶ Bump

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    packages: write

jobs:
    build-publish-release:
        runs-on: ubuntu-latest

        # 1) Забираем код
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 2) Считываем текущую версию из gradle.properties
            - name: Read version
              id: read_version
              run: |
                  LINE=$(grep '^version=' gradle.properties)
                  VERSION=${LINE#version=}
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  if [[ "$VERSION" == *-SNAPSHOT ]]; then
                    echo "is_snapshot=true" >> $GITHUB_OUTPUT
                  else
                    echo "is_snapshot=false" >> $GITHUB_OUTPUT
                  fi

            # 3) Если это snapshot - просто выходим (ни сборки, ни релиза)
            - name: Skip on snapshot
              if: ${{ steps.read_version.outputs.is_snapshot == 'true' }}
              run: |
                  echo "Detected SNAPSHOT version (${{ steps.read_version.outputt.version }})"

            # 4) Устанавливаем JDK и Gradle
            - name: Setup JDK
              if: ${{ steps.read_version.outputs.is_snapshot == 'false' }}
              uses: actions/setup-java@v3
              with:
                  distribution: 'temurin'
                  java-version: '21'

            # 5) Собираем и публикуем модули
            - name: Build & Publish ti GitHub Packages
              if: ${{ steps.read_version.outputs.is_snapshot == 'false' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACTOR: ${{ github.actor }}
              run: |
                ./gradlew cleanPublish --no-daemon -x test

            # 6) Создаем GitHub Release на тег vX.Y.Z
            - name: Create GitHub Release
              if: ${{ steps.read_version.outputs.is_snapshot == 'false' }}
              id: create_release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "v${{ steps.read_version.outputs.version }}"
                  name: "Release ${{ steps.read_version.outputs.version }}"
                  draft: false
                  prerelease: ${{ contains(steps.read_version.outputs.version, '-rc') || contains(steps.read_version.outputs.version, '-beta') }}
                  generate_release_notes: true
                  files: |
                      ksp/build/libs/ksp-${{ steps.read_version.outputs.version }}.jar
                      api/build/libs/api-${{ steps.read_version.outputs.version }}.jar
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 7) После релиза - bump патч-версию и добавляем суффикс -SNAPSHOT
            - name: Bump to next patch-SNAPSHOT
              if: ${{ steps.read_version.outputs.is_snapshot == 'false' }}
              run: |
                  CUR=${{ steps.read_version.outputs.version }}
                  NEXT=$(echo $CUR | awk -F. -v OFS=. '{$NF = $NF+1; print}')
                  echo "🔄Bumping version to ${NEXT}-SNAPSHOT"
                  sed -i "s/^version=.*/version=${NEXT}-SNAPSHOT/" gradle.properties
                  
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout main
                  git add gradle.properties
                  git commit -m "chore: bump to ${NEXT}-SNAPSHOT"
                  git push